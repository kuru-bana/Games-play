<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Super Mario Bros.</title>
  <style>
    * { padding: 0; margin: 0; }
    html, body { background: #000; color: #fff; overflow: hidden; touch-action: none; width: 100%; height: 100%; }
    canvas { touch-action: none; -ms-touch-action: none; }
    #loading-screen {
      position: fixed; inset: 0; background: #0f0505;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; z-index: 100;
    }
    #loading-screen .thumb {
      width: 280px; height: 158px; object-fit: cover; border-radius: 12px;
      border: 2px solid #ef444455; box-shadow: 0 4px 24px #ef444444;
    }
    #loading-screen h2 {
      font-family: 'Segoe UI', sans-serif; font-size: 22px;
      background: linear-gradient(90deg, #f87171, #fbbf24);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #loading-screen .progress-wrap { width: 300px; height: 6px; background: #2a0808; border-radius: 3px; overflow: hidden; }
    #loading-screen .progress-fill { height: 100%; background: linear-gradient(90deg, #ef4444, #d97706); border-radius: 3px; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { width: 20%; } 50% { width: 80%; } }
    #loading-screen .pct { font-family: monospace; color: #8a3030; font-size: 13px; }
    #loading-screen .cdn-label { font-family: monospace; color: #4a1010; font-size: 11px; }
    #c2canvasdiv { display: none; }
    #c2canvas { width: 100%; height: 100%; }
  </style>
</head>
<body>
<div id="loading-screen">
  <img class="thumb" src="https://freezenova.com/lessons/super_mario_bros_old.webp" alt="Super Mario Bros" onerror="this.style.display='none'">
  <h2>🍄 Super Mario Bros.</h2>
  <div class="progress-wrap"><div class="progress-fill"></div></div>
  <div class="pct" id="pct">ゲームを読み込み中...</div>
  <div class="cdn-label" id="cdn-label">CDNに接続中...</div>
</div>
<div id="c2canvasdiv">
  <canvas id="c2canvas" width="256" height="224"></canvas>
</div>
<script>
var CDN_PROVIDERS = [
  "https://cdn.jsdelivr.net/gh/kuru-bana/Games@main",
  "https://raw.githubusercontent.com/kuru-bana/Games/main"
];
var idx = 0;

function tryLoad() {
  if (idx >= CDN_PROVIDERS.length) {
    document.getElementById('loading-screen').innerHTML =
      '<h2 style="color:#ef4444;font-family:sans-serif;">CDNからの読み込みに失敗しました</h2>' +
      '<p style="color:#888;font-family:sans-serif;font-size:13px;">jsDelivr・GitHub Raw どちらも応答なし</p>';
    return;
  }
  var base = CDN_PROVIDERS[idx++];
  var B = base + '/super-mario-bros';
  document.getElementById('cdn-label').textContent =
    (base.includes('jsdelivr') ? 'jsDelivr' : 'GitHub Raw') + ' から読み込み中...';

  var jq = document.createElement('script');
  jq.src = B + '/jquery-2.1.1.min.js';
  jq.onload = function() {
    var cr = document.createElement('script');
    cr.src = B + '/c2runtime.js';
    cr.onload = function() {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('c2canvasdiv').style.display = 'block';
      jQuery(document).ready(function() {
        cr_createRuntime("c2canvas");
      });
    };
    cr.onerror = function() { tryLoad(); };
    document.body.appendChild(cr);
  };
  jq.onerror = function() { tryLoad(); };
  document.body.appendChild(jq);
}

tryLoad();
</script>
</body>
</html>
