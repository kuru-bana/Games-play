<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0505;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1a0505, #2d0a08);
      border-bottom: 1px solid #ef444422;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header .back {
      color: #f87171;
      text-decoration: none;
      font-size: 13px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    header .back:hover { opacity: 1; }
    header h1 {
      font-size: 28px;
      background: linear-gradient(90deg, #f87171, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header .icon { font-size: 32px; }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
    }
    .game-card {
      background: linear-gradient(135deg, #1a0808, #2a0e0e);
      border: 1px solid #ef444422;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .game-card:hover {
      transform: translateY(-4px);
      border-color: #ef4444;
      box-shadow: 0 8px 32px #ef444433;
    }
    .game-card .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #150505;
      position: relative;
      overflow: hidden;
    }
    .game-card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }
    .game-card:hover .thumb img { transform: scale(1.05); }
    .game-card .thumb .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #dc2626;
      color: white;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .game-card .info { padding: 20px; }
    .game-card .info h2 {
      font-size: 18px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #f87171, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .game-card .info p {
      font-size: 13px;
      color: #8a5555;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .game-card .info .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #dc2626, #d97706);
      color: white;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .game-card:hover .play-btn { opacity: 0.9; }
  </style>
</head>
<body>

<header>
  <span class="icon">🍄</span>
  <h1>Mario Games</h1>
  <a class="back" href="../index.html" style="margin-left:auto">← ポータルトップ</a>
</header>

<div class="games-grid">

  <div class="game-card" style="opacity:0.45;cursor:not-allowed;pointer-events:none;">
    <div class="thumb">
      <img src="https://freezenova.com/lessons/super_mario_bros_old.webp" alt="Super Mario Bros" onerror="this.style.display='none'">
      <span class="badge" style="background:#555;">準備中</span>
    </div>
    <div class="info">
      <h2>Super Mario Bros.</h2>
      <p>1985年発売のレジェンド。マリオを操ってキノコ王国を旅し、ピーチ姫をクッパから救え！</p>
      <span class="play-btn" style="background:#444;">🔒 近日公開</span>
    </div>
  </div>

  <a class="game-card" href="super-mario-64.html">
    <div class="thumb">
      <img src="https://freezenova.com/lessons/supermario64.webp" alt="Super Mario 64" onerror="this.style.display='none'">
      <span class="badge">3D Classic</span>
    </div>
    <div class="info">
      <h2>Super Mario 64</h2>
      <p>1996年に3Dゲームを革命した伝説作。絵画に入って120枚のパワースターを集めよう！</p>
      <span class="play-btn">▶ プレイ</span>
    </div>
  </a>

</div>

</body>
</html>
