<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Blast</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #100800; overflow: hidden; }
    #back-btn {
      position: fixed; top: 12px; left: 12px; z-index: 1000;
      background: rgba(0,0,0,0.75); color: #fff; border: 1px solid #f59732;
      padding: 8px 16px; border-radius: 8px; font-size: 13px;
      cursor: pointer; text-decoration: none; font-family: 'Segoe UI', sans-serif;
      transition: background 0.2s;
    }
    #back-btn:hover { background: #f59732; color: #000; }
    #loading-screen {
      position: fixed; inset: 0; background: #100800;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; z-index: 100;
    }
    #loading-screen .thumb {
      width: 280px; height: 158px; object-fit: cover; border-radius: 12px;
      border: 2px solid #f5973255; box-shadow: 0 4px 24px #f5973244;
    }
    #loading-screen h2 {
      font-family: 'Segoe UI', sans-serif; font-size: 22px;
      background: linear-gradient(90deg, #fbbf24, #f97316);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #loading-screen .progress-wrap { width: 300px; height: 6px; background: #2a1500; border-radius: 3px; overflow: hidden; }
    #loading-screen .progress-fill {
      height: 100%; background: linear-gradient(90deg, #fbbf24, #f97316);
      width: 0%; transition: width 0.2s; border-radius: 3px;
    }
    #loading-screen .pct { font-family: monospace; color: #a06020; font-size: 13px; }
    #loading-screen .cdn-label { font-family: monospace; color: #4a2500; font-size: 11px; }
    #error-screen {
      position: fixed; inset: 0; background: #100800;
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; z-index: 200;
      font-family: 'Segoe UI', sans-serif; text-align: center;
    }
    div#gameContainer {
      background: transparent !important; position: absolute;
      top: 0 !important; width: 100% !important; height: 100% !important; left: 0 !important;
    }
    div#gameContainer canvas { position: absolute; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
<a href="../index.html" id="back-btn">← ポータルトップ</a>
<div id="loading-screen">
  <img class="thumb" src="https://freezenova.com/lessons/img/block-blast.jpg" alt="Block Blast" onerror="this.style.display='none'">
  <h2>🧱 Block Blast</h2>
  <div class="progress-wrap"><div class="progress-fill" id="pf"></div></div>
  <div class="pct" id="pct">0%</div>
  <div class="cdn-label" id="cdn-label">CDNに接続中...</div>
</div>
<div id="error-screen">
  <h2 style="color:#ef4444;font-size:20px;">⚠️ 読み込みに失敗しました</h2>
  <p style="color:#888;font-size:14px;">jsDelivr・GitHub Raw どちらも応答なし</p>
</div>
<div id="gameContainer" style="display:none;">
  <canvas id="unity-canvas" data-pixel-art=""></canvas>
</div>
<script src="../config.js"></script>
<script>
(function() {
  var canvas = document.getElementById('unity-canvas');
  var config = { streamingAssetsUrl: 'StreamingAssets' };

  function progressHandler(progress) {
    var pct = Math.round(progress * 100);
    document.getElementById('pf').style.width = pct + '%';
    document.getElementById('pct').textContent = pct + '%';
  }

  window.loadWithFallback('/block-blast/Build/game.loader.js',
    function(base) {
      document.getElementById('cdn-label').textContent =
        (base.includes('jsdelivr') ? 'jsDelivr' : 'GitHub Raw') + ' から読み込み中...';
      var B = base + '/block-blast/Build';
      config.dataUrl      = B + '/game.data.unityweb';
      config.frameworkUrl = B + '/game.framework.js.unityweb';
      config.codeUrl      = B + '/game.wasm.unityweb';
      createUnityInstance(canvas, config, progressHandler).then(function(instance) {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('gameContainer').style.display = 'block';
        window.gameInstance = instance;
      }).catch(function(err) { console.error('Unity error:', err); });
    },
    function() {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('error-screen').style.display = 'flex';
    }
  );
})();
</script>
</body>
</html>
