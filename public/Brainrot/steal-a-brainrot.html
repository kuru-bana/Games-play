<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Steal a Brainrot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100%; height: 100vh; overflow: hidden; }

    #back-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 1px solid #7c3aed;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    #back-btn:hover { background: #7c3aed; }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
    }

    #loading-screen .thumb {
      width: 280px;
      height: 158px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #7c3aed55;
      box-shadow: 0 4px 24px #7c3aed44;
    }

    #loading-screen h2 {
      font-family: 'Segoe UI', sans-serif;
      font-size: 22px;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #loading-screen .progress-wrap {
      width: 300px;
      height: 6px;
      background: #1a1a2e;
      border-radius: 3px;
      overflow: hidden;
    }

    #loading-screen .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      width: 0%;
      transition: width 0.2s;
      border-radius: 3px;
    }

    #loading-screen .pct {
      font-family: monospace;
      color: #888;
      font-size: 13px;
    }

    #error-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 200;
      padding: 40px;
      text-align: center;
    }

    #error-screen h2 {
      font-family: 'Segoe UI', sans-serif;
      color: #ef4444;
      font-size: 20px;
    }

    #error-screen p {
      font-family: 'Segoe UI', sans-serif;
      color: #888;
      font-size: 14px;
      max-width: 500px;
      line-height: 1.6;
    }

    #error-screen code {
      background: #1a1a2e;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: #a855f7;
    }

    #error-screen a { color: #a855f7; text-decoration: none; }

    html, body { width: 100%; height: 100%; }

    #unity-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #231f20;
      display: block;
    }

    #loading-cover {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

<a href="index.html" id="back-btn">← ゲーム一覧</a>

<div id="error-screen">
  <h2>⚠️ CDNが未設定です</h2>
  <p>
    <code>public/config.js</code> を開いて、<code>YOUR_USERNAME</code> を実際のGitHubユーザー名に変更してください。<br><br>
    詳しくは <a href="index.html#setup">セットアップ手順</a> をご覧ください。
  </p>
</div>

<div id="loading-screen">
  <img class="thumb" src="https://freezenova.com/lessons/img/steal-a-brainrot.jpg" alt="Steal a Brainrot" onerror="this.style.display='none'">
  <h2>🤯 Steal a Brainrot</h2>
  <div class="progress-wrap"><div class="progress-fill" id="pf"></div></div>
  <div class="pct" id="pct">0%</div>
  <div style="color:#555;font-size:12px;font-family:monospace;">ゲームファイルをCDNから読み込み中...</div>
</div>

<div id="game-wrap" style="display:none;width:100%;height:100%;">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="600"></canvas>
  </div>
</div>

<script src="config.js"></script>
<script>
(function() {
  var cdn = window.CDN_BASE;
  if (!cdn || cdn.includes('YOUR_USERNAME')) {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display = 'flex';
    return;
  }

  var BASE = cdn + '/steal-a-brainrot'; // initial, may be updated by fallback

  var canvas = document.querySelector('#unity-canvas');
  var config = {
    dataUrl: BASE + '/devsabd.js',
    frameworkUrl: BASE + '/devsabf.js',
    codeUrl: BASE + '/devsabw.js',
    streamingAssetsUrl: 'StreamingAssets',
  };

  HTMLCanvasElement.prototype.requestPointerLock = function() {
    console.log('Pointer lock blocked.');
  };

  function isMobileDevice() {
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    return (/android/i.test(ua) && !/mobile/i.test(ua)) ||
      /iPad|Tablet|PlayBook/i.test(ua) ||
      /Mobile|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) ||
      (isTouch && /Macintosh/i.test(ua));
  }

  if (isMobileDevice()) {
    window.environmentData = {
      language: 'en', domain: 'default_domain', deviceType: 'mobile',
      appID: 'default_app_id', browserLang: navigator.language || 'en'
    };
  } else {
    var environmentData = 'null';
    window.environmentData = environmentData;
    window.jsonEnvir = {
      language: 'en', domain: 'default_domain', deviceType: 'desktop',
      appID: 'default_app_id', browserLang: navigator.language || 'en'
    };
  }

  window.cloudSaves = 'noData';
  window.paymentsData = 'none';
  window.playerData = 'noData';

  window.ysdk = {
    environment: {
      i18n: { lang: navigator.language ? navigator.language.slice(0,2) : 'en', tld: 'com' },
      app: { id: '' },
      browser: { lang: navigator.language || 'en' },
      payload: ''
    },
    features: {
      LoadingAPI: { ready: function() {} }
    },
    getLeaderboards: function() { return Promise.resolve(null); },
    getPlayer: function() { return Promise.resolve({ getMode: function(){ return ''; }, getData: function(){ return Promise.resolve({}); }, setData: function(){ return Promise.resolve(); }, getName: function(){ return ''; }, getPhoto: function(){ return ''; } }); },
    auth: { openAuthDialog: function() { return Promise.resolve(); } },
    adv: { showFullscreenAdv: function(o){ if(o&&o.callbacks&&o.callbacks.onClose) o.callbacks.onClose(false); }, showRewardedVideo: function(o){ if(o&&o.callbacks&&o.callbacks.onClose) o.callbacks.onClose(); } },
    isAvailableMethod: function() { return false; }
  };

  function progressHandler(progress) {
    var pct = Math.round(progress * 100);
    document.getElementById('pf').style.width = pct + '%';
    document.getElementById('pct').textContent = pct + '%';
  }

  window.loadWithFallback('/steal-a-brainrot/dev.js',
    function(activeBase) {
      var B = activeBase + '/steal-a-brainrot';
      config.dataUrl      = B + '/devsabd.js';
      config.frameworkUrl = B + '/devsabf.js';
      config.codeUrl      = B + '/devsabw.js';
      var apiScript = document.createElement('script');
      apiScript.src = B + '/api.js';
      apiScript.onerror = function() {};
      document.body.appendChild(apiScript);
      createUnityInstance(canvas, config, progressHandler).then(function(instance) {
        window.myGameInstance = instance;
        setTimeout(function() {
          document.getElementById('loading-screen').style.display = 'none';
          document.getElementById('game-wrap').style.display = 'block';
        }, 1000);
      }).catch(function(err) { console.error('Unity load error:', err); });
    },
    function() {
      document.getElementById('loading-screen').innerHTML =
        '<h2 style="color:#ef4444;font-family:sans-serif;">CDNからの読み込みに失敗しました</h2>' +
        '<p style="color:#888;font-family:sans-serif;font-size:13px;">jsDelivr・GitHub Raw どちらも応答なし</p>';
    }
  );

  var leaderboard = null;

  function FullAdShow() {
    if (window.myGameInstance) window.myGameInstance.SendMessage('YandexGame', 'CloseFullAd', 'false');
  }
  function RewardedShow(id) {
    if (window.myGameInstance) {
      window.myGameInstance.SendMessage('YandexGame', 'RewardVideo', id);
      window.myGameInstance.SendMessage('YandexGame', 'CloseVideo');
    }
  }
  function OpenAuthDialog() {
    if (window.myGameInstance) window.myGameInstance.SendMessage('YandexGame', 'GetDataInvoke');
  }
  function SaveCloud(jsonData, flush) {}
  function InitGame(photoSize, scopes, gameReadyApi) {}
  function GameReadyAPI() {}
  function GetLeaderboardScores() {}
  function ConsumePurchases() {}
  function GetPayments() { return Promise.resolve('none'); }
  function InitLeaderboard() {
    try {
      window.ysdk.getLeaderboards().then(function(_lb) {
        leaderboard = _lb;
        if (window.myGameInstance) window.myGameInstance.SendMessage('YandexGame', 'InitializedLB');
      }).catch(function() {});
    } catch(e) {}
  }
  function SetLeaderboardScore(leaderboardName, score) {}
  function GetLeaderboardEntries(leaderboardName) {}
  function AuthPlayer() {
    if (window.myGameInstance) window.myGameInstance.SendMessage('YandexGame', 'GetDataInvoke');
  }
  function ReviewShow() {}
  function GetDataCloud() {
    if (window.myGameInstance) window.myGameInstance.SendMessage('YandexGame', 'GetDataInvoke');
  }
})();
</script>
</body>
</html>
