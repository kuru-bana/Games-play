<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEEDY STREAMER OVERLOAD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #120b12; overflow: hidden; }
    #back-btn {
      position: fixed; top: 12px; left: 12px; z-index: 1000;
      background: rgba(0,0,0,0.75); color: #fff; border: 1px solid #22c55e;
      padding: 8px 16px; border-radius: 8px; font-size: 13px;
      cursor: pointer; text-decoration: none; font-family: 'Segoe UI', sans-serif;
      transition: background 0.2s;
    }
    #back-btn:hover { background: #15803d; }
    #canvas {
      width: 100%;
      height: 100vh;
      display: block;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #120b12;
      z-index: 100;
    }
    #loader.hide { display: none; }
    #loader .thumb {
      width: 280px; height: 158px; object-fit: cover; border-radius: 12px;
      border: 2px solid #22c55e55; box-shadow: 0 4px 24px #22c55e44;
    }
    #loader h2 {
      font-family: 'Segoe UI', sans-serif; font-size: 22px;
      background: linear-gradient(90deg, #4ade80, #22c55e);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #unity-progress-bar-empty {
      width: 300px; height: 6px; background: #001500; border-radius: 3px; overflow: hidden;
    }
    #unity-progress-bar-full {
      height: 100%; background: linear-gradient(90deg, #4ade80, #22c55e);
      width: 0%; transition: width 0.3s; border-radius: 3px;
    }
    #pct { font-family: monospace; color: #2a6a2a; font-size: 13px; }
    #cdn-label { font-family: monospace; color: #1a4a1a; font-size: 11px; }
    #error-screen {
      position: fixed; inset: 0; background: #120b12;
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; z-index: 200;
      font-family: 'Segoe UI', sans-serif; text-align: center;
    }
  </style>
</head>
<body>
<a href="index.html" id="back-btn">← Enternet 一覧</a>

<canvas id="canvas"></canvas>

<div id="loader">
  <img class="thumb" src="https://cdn.akamai.steamstatic.com/steam/apps/1451940/header.jpg" alt="NEEDY STREAMER OVERLOAD" onerror="this.style.display='none'">
  <h2>💻 NEEDY STREAMER OVERLOAD</h2>
  <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
  <div id="pct">0%</div>
  <div id="cdn-label">ローダーを取得中...</div>
</div>

<div id="error-screen">
  <h2 style="color:#ef4444;font-size:20px;">⚠️ 読み込みに失敗しました</h2>
  <p style="color:#888;font-size:14px;">ゲームデータを取得できませんでした。</p>
</div>

<script>
(function() {
  var canvas = document.getElementById('canvas');
  var loader = document.getElementById('loader');
  var progressBarFull = document.getElementById('unity-progress-bar-full');

  var LFS_BASE = '/lfs-proxy/kuru-bana/Games/main/nso_fix/Build';

  var config = {
    dataUrl:      LFS_BASE + '/nsoweather2.data.unityweb',
    frameworkUrl: LFS_BASE + '/nsoweather2.framework.js.unityweb',
    codeUrl:      LFS_BASE + '/nsoweather2.wasm.unityweb',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'WSS playground',
    productName: 'Windose',
    productVersion: '1.4.0',
  };

  function showError() {
    loader.classList.add('hide');
    document.getElementById('error-screen').style.display = 'flex';
  }

  function onResize() {
    canvas.style.width  = window.innerWidth  + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  onResize();
  window.addEventListener('resize', onResize);

  var LOADER_BASES = [
    '/gh-proxy/kuru-bana/Games/main',
    'https://raw.githubusercontent.com/kuru-bana/Games/main',
    'https://github.com/kuru-bana/Games/raw/main'
  ];
  var idx = 0;

  function tryLoader() {
    if (idx >= LOADER_BASES.length) { showError(); return; }
    var base = LOADER_BASES[idx++];
    document.getElementById('cdn-label').textContent = 'ローダー取得中...';
    var s = document.createElement('script');
    s.src = base + '/nso_fix/Build/nsoweather2.loader.js';
    s.onload = function() {
      if (typeof createUnityInstance !== 'function') { tryLoader(); return; }
      document.getElementById('cdn-label').textContent = 'ゲームデータ読み込み中 (約370MB)...';
      createUnityInstance(canvas, config, function(progress) {
        var pct = Math.round(progress * 100);
        progressBarFull.style.width = pct + '%';
        document.getElementById('pct').textContent = pct + '%';
      }).then(function(instance) {
        window.gameInstance = instance;
        loader.classList.add('hide');
      }).catch(function(err) {
        console.error('Unity error:', err);
        showError();
      });
    };
    s.onerror = tryLoader;
    document.body.appendChild(s);
  }

  tryLoader();
})();
</script>
</body>
</html>
