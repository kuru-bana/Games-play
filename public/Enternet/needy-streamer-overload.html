<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEEDY STREAMER OVERLOAD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000d00; overflow: hidden; }
    #back-btn {
      position: fixed; top: 12px; left: 12px; z-index: 1000;
      background: rgba(0,0,0,0.75); color: #fff; border: 1px solid #22c55e;
      padding: 8px 16px; border-radius: 8px; font-size: 13px;
      cursor: pointer; text-decoration: none; font-family: 'Segoe UI', sans-serif;
      transition: background 0.2s;
    }
    #back-btn:hover { background: #15803d; }
    #loading-screen {
      position: fixed; inset: 0; background: #000d00;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; z-index: 100;
    }
    #loading-screen .thumb {
      width: 280px; height: 158px; object-fit: cover; border-radius: 12px;
      border: 2px solid #22c55e55; box-shadow: 0 4px 24px #22c55e44;
    }
    #loading-screen h2 {
      font-family: 'Segoe UI', sans-serif; font-size: 22px;
      background: linear-gradient(90deg, #4ade80, #22c55e);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #loading-screen .progress-wrap { width: 300px; height: 6px; background: #001500; border-radius: 3px; overflow: hidden; }
    #loading-screen .progress-fill {
      height: 100%; background: linear-gradient(90deg, #4ade80, #22c55e);
      width: 0%; transition: width 0.3s; border-radius: 3px;
    }
    #loading-screen .pct { font-family: monospace; color: #2a6a2a; font-size: 13px; }
    #loading-screen .cdn-label { font-family: monospace; color: #1a4a1a; font-size: 11px; }
    #error-screen {
      position: fixed; inset: 0; background: #000d00;
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; z-index: 200;
      font-family: 'Segoe UI', sans-serif; text-align: center;
    }
    div#gameContainer {
      background: transparent !important; position: absolute;
      top: 0 !important; width: 100% !important; height: 100% !important; left: 0 !important;
    }
    div#gameContainer canvas { position: absolute; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
<a href="index.html" id="back-btn">← Enternet 一覧</a>
<div id="loading-screen">
  <img class="thumb" src="https://cdn.akamai.steamstatic.com/steam/apps/1451940/header.jpg" alt="NEEDY STREAMER OVERLOAD" onerror="this.style.display='none'">
  <h2>💻 NEEDY STREAMER OVERLOAD</h2>
  <div class="progress-wrap"><div class="progress-fill" id="pf"></div></div>
  <div class="pct" id="pct">0%</div>
  <div class="cdn-label" id="cdn-label">ローダーを取得中...</div>
</div>
<div id="error-screen">
  <h2 style="color:#ef4444;font-size:20px;">⚠️ 読み込みに失敗しました</h2>
  <p style="color:#888;font-size:14px;">nso_fix のデータファイルを取得できませんでした。<br>サーバーログを確認してください。</p>
</div>
<div id="gameContainer" style="display:none;">
  <canvas id="unity-canvas" data-pixel-art=""></canvas>
</div>
<script>
(function() {
  var canvas = document.getElementById('unity-canvas');
  var config = { streamingAssetsUrl: 'StreamingAssets' };

  var LFS_PROXY = '/lfs-proxy/kuru-bana/Games/main/nso_fix/Build';

  var LOADER_BASES = [
    'https://cdn.jsdelivr.net/gh/kuru-bana/Games@main',
    'https://raw.githubusercontent.com/kuru-bana/Games/main',
    'https://github.com/kuru-bana/Games/raw/main'
  ];

  function showError() {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display = 'flex';
  }

  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    canvas.style.width = canvas.parentElement.style.width = w + 'px';
    canvas.style.height = canvas.parentElement.style.height = h + 'px';
  }

  function progressHandler(progress) {
    var pct = Math.round(progress * 100);
    document.getElementById('pf').style.width = pct + '%';
    document.getElementById('pct').textContent = pct + '%';
  }

  function launchGame() {
    document.getElementById('cdn-label').textContent = 'LFS データをサーバー経由で取得中 (data: 370MB)...';
    config.dataUrl      = LFS_PROXY + '/nsoweather2.data.unityweb';
    config.frameworkUrl = LFS_PROXY + '/nsoweather2.framework.js.unityweb';
    config.codeUrl      = LFS_PROXY + '/nsoweather2.wasm.unityweb';
    createUnityInstance(canvas, config, progressHandler).then(function(instance) {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('gameContainer').style.display = 'block';
      onResize();
      window.gameInstance = instance;
    }).catch(function(err) {
      console.error('Unity error:', err);
      showError();
    });
  }

  var idx = 0;
  function tryLoader() {
    if (idx >= LOADER_BASES.length) { showError(); return; }
    var base = LOADER_BASES[idx++];
    document.getElementById('cdn-label').textContent =
      (base.includes('jsdelivr') ? 'jsDelivr' : 'GitHub') + ' からローダー取得中...';
    var s = document.createElement('script');
    s.src = base + '/nso_fix/Build/nsoweather2.loader.js';
    s.onload = function() {
      if (typeof createUnityInstance !== 'function') { tryLoader(); return; }
      launchGame();
    };
    s.onerror = tryLoader;
    document.body.appendChild(s);
  }

  tryLoader();
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
