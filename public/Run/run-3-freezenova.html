<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run 3 Freezenova</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #060c18; overflow: hidden; }
    #back-btn {
      position: fixed; top: 12px; left: 12px; z-index: 1000;
      background: rgba(0,0,0,0.75); color: #fff; border: 1px solid #0ea5e9;
      padding: 8px 16px; border-radius: 8px; font-size: 13px;
      cursor: pointer; text-decoration: none; font-family: 'Segoe UI', sans-serif;
      transition: background 0.2s;
    }
    #back-btn:hover { background: #0ea5e9; }
    #loading-screen {
      position: fixed; inset: 0; background: #060c18;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; z-index: 100;
    }
    #loading-screen .thumb {
      width: 280px; height: 158px; object-fit: cover; border-radius: 12px;
      border: 2px solid #0ea5e955; box-shadow: 0 4px 24px #0ea5e944;
    }
    #loading-screen h2 {
      font-family: 'Segoe UI', sans-serif; font-size: 22px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #loading-screen .progress-wrap { width: 300px; height: 6px; background: #0d1b2e; border-radius: 3px; overflow: hidden; }
    #loading-screen .progress-fill {
      height: 100%; background: linear-gradient(90deg, #0ea5e9, #6366f1);
      width: 0%; transition: width 0.2s; border-radius: 3px;
    }
    #loading-screen .pct { font-family: monospace; color: #3a7aaa; font-size: 13px; }
    #loading-screen .cdn-label { font-family: monospace; color: #1e3a5f; font-size: 11px; }
    #error-screen {
      position: fixed; inset: 0; background: #060c18;
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; z-index: 200;
      font-family: 'Segoe UI', sans-serif; text-align: center;
    }
    div#gameContainer {
      background: transparent !important; position: absolute;
      top: 0 !important; width: 100% !important; height: 100% !important; left: 0 !important;
    }
    div#gameContainer canvas { position: absolute; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
<a href="index.html" id="back-btn">← Run ゲーム一覧</a>
<div id="loading-screen">
  <img class="thumb" src="https://freezenova.com/lessons/img2/run-freezenova.webp" alt="Run 3 Freezenova" onerror="this.style.display='none'">
  <h2>🏃 Run 3 Freezenova</h2>
  <div class="progress-wrap"><div class="progress-fill" id="pf"></div></div>
  <div class="pct" id="pct">0%</div>
  <div class="cdn-label" id="cdn-label">CDNに接続中...</div>
</div>
<div id="error-screen">
  <h2 style="color:#ef4444;font-size:20px;">⚠️ 読み込みに失敗しました</h2>
  <p style="color:#888;font-size:14px;">jsDelivr・GitHub Raw どちらも応答なし</p>
</div>
<div id="gameContainer" style="display:none;">
  <canvas id="unity-canvas" data-pixel-art=""></canvas>
</div>
<script src="../config.js"></script>
<script>
(function() {
  var canvas = document.getElementById('unity-canvas');
  var config = { streamingAssetsUrl: 'StreamingAssets' };

  function progressHandler(progress) {
    var pct = Math.round(progress * 100);
    document.getElementById('pf').style.width = pct + '%';
    document.getElementById('pct').textContent = pct + '%';
  }

  function onResize() {
    var container = canvas.parentElement;
    var w = window.innerWidth, h = window.innerHeight;
    container.style.width = canvas.style.width = w + 'px';
    container.style.height = canvas.style.height = h + 'px';
  }

  window.loadWithFallback('/run-3-freezenova/Build/game.loader.js',
    function(base) {
      document.getElementById('cdn-label').textContent =
        (base.includes('jsdelivr') ? 'jsDelivr' : 'GitHub Raw') + ' から読み込み中...';
      var B = base + '/run-3-freezenova/Build';
      config.dataUrl      = B + '/game.data.unityweb';
      config.frameworkUrl = B + '/game.framework.js.unityweb';
      config.codeUrl      = B + '/game.wasm.unityweb';
      createUnityInstance(canvas, config, progressHandler).then(function(instance) {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('gameContainer').style.display = 'block';
        onResize();
        window.gameInstance = instance;
      }).catch(function(err) { console.error('Unity error:', err); });
    },
    function() {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('error-screen').style.display = 'flex';
    }
  );
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
