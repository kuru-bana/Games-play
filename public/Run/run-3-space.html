<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run 3 Space</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #060c18; overflow: hidden; }
    #back-btn {
      position: fixed; top: 12px; left: 12px; z-index: 1000;
      background: rgba(0,0,0,0.75); color: #fff; border: 1px solid #38bdf8;
      padding: 8px 16px; border-radius: 8px; font-size: 13px;
      cursor: pointer; text-decoration: none; font-family: 'Segoe UI', sans-serif;
      transition: background 0.2s;
    }
    #back-btn:hover { background: #0284c7; }
    #loading-screen {
      position: fixed; inset: 0; background: #060c18;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; z-index: 100;
    }
    #loading-screen .thumb {
      width: 280px; height: 158px; object-fit: cover; border-radius: 12px;
      border: 2px solid #38bdf855; box-shadow: 0 4px 24px #38bdf844;
    }
    #loading-screen h2 {
      font-family: 'Segoe UI', sans-serif; font-size: 22px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #loading-screen .progress-wrap { width: 300px; height: 6px; background: #0d1b2e; border-radius: 3px; overflow: hidden; }
    #loading-screen .progress-fill {
      height: 100%; background: linear-gradient(90deg, #38bdf8, #6366f1);
      border-radius: 3px; animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { width: 20%; } 50% { width: 80%; } }
    #loading-screen .pct { font-family: monospace; color: #3a7aaa; font-size: 13px; }
    #loading-screen .cdn-label { font-family: monospace; color: #1e3a5f; font-size: 11px; }
    #error-screen {
      position: fixed; inset: 0; background: #060c18;
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; z-index: 200;
      font-family: 'Segoe UI', sans-serif; text-align: center;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: none; position: absolute; top: 0; left: 0;
    }
  </style>
</head>
<body>
<a href="index.html" id="back-btn">← Run ゲーム一覧</a>
<div id="loading-screen">
  <img class="thumb" src="https://freezenova.com/lessons/img2/run-1-game.webp" alt="Run 3 Space" onerror="this.style.display='none'">
  <h2>🚀 Run 3 Space</h2>
  <div class="progress-wrap"><div class="progress-fill"></div></div>
  <div class="pct" id="pct">ゲームを確認中...</div>
  <div class="cdn-label" id="cdn-label">CDNに接続中...</div>
</div>
<div id="error-screen">
  <h2 style="color:#ef4444;font-size:20px;">⚠️ 読み込みに失敗しました</h2>
  <p style="color:#888;font-size:14px;">ゲームファイルがCDNで見つかりませんでした。<br>GitHubリポジトリに run-3-space フォルダを追加してください。</p>
</div>
<iframe id="game-frame"
  allowfullscreen
  allow="autoplay; fullscreen *; geolocation; microphone; camera; midi; monetization; xr-spatial-tracking; gamepad; gyroscope; accelerometer"
></iframe>
<script>
(function() {
  var PROVIDERS = [
    'https://cdn.jsdelivr.net/gh/kuru-bana/Games@main',
    'https://raw.githubusercontent.com/kuru-bana/Games/main'
  ];
  var frame = document.getElementById('game-frame');
  var idx = 0;

  function tryNext() {
    if (idx >= PROVIDERS.length) {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('error-screen').style.display = 'flex';
      return;
    }
    var base = PROVIDERS[idx++];
    var gameUrl = base + '/run-3-space/index.html';
    document.getElementById('cdn-label').textContent =
      (base.includes('jsdelivr') ? 'jsDelivr' : 'GitHub Raw') + ' から確認中...';

    fetch(gameUrl, { method: 'HEAD' })
      .then(function(res) {
        if (!res.ok) { tryNext(); return; }
        document.getElementById('pct').textContent = 'ゲームを読み込み中...';
        document.getElementById('cdn-label').textContent =
          (base.includes('jsdelivr') ? 'jsDelivr' : 'GitHub Raw') + ' から読み込み中...';
        frame.src = gameUrl;
        frame.onload = function() {
          document.getElementById('loading-screen').style.display = 'none';
          frame.style.display = 'block';
        };
      })
      .catch(function() { tryNext(); });
  }

  tryNext();
})();
</script>
</body>
</html>
