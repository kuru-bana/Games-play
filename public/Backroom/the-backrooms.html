<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Backrooms</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a00; overflow: hidden; }
    #back-btn {
      position: fixed; top: 12px; left: 12px; z-index: 1000;
      background: rgba(0,0,0,0.75); color: #fff; border: 1px solid #a3a300;
      padding: 8px 16px; border-radius: 8px; font-size: 13px;
      cursor: pointer; text-decoration: none; font-family: 'Segoe UI', sans-serif;
      transition: background 0.2s;
    }
    #back-btn:hover { background: #5c5c00; }
    #loading-screen {
      position: fixed; inset: 0; background: #0a0a00;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; z-index: 100;
    }
    #loading-screen h2 {
      font-family: 'Segoe UI', sans-serif; font-size: 22px;
      background: linear-gradient(90deg, #d4d400, #a3a300);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #loading-screen .progress-wrap { width: 300px; height: 6px; background: #1a1a00; border-radius: 3px; overflow: hidden; }
    #loading-screen .progress-fill {
      height: 100%; background: linear-gradient(90deg, #d4d400, #a3a300);
      width: 0%; transition: width 0.3s; border-radius: 3px;
    }
    #loading-screen .pct { font-family: monospace; color: #6a6a00; font-size: 13px; }
    #loading-screen .cdn-label { font-family: monospace; color: #3a3a00; font-size: 11px; }
    #error-screen {
      position: fixed; inset: 0; background: #0a0a00;
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; z-index: 200;
      font-family: 'Segoe UI', sans-serif; text-align: center;
    }
    .webgl-content { width: 100%; height: 100%; }
    #gameContainer { width: 100%; height: 100%; display: none; }
  </style>
</head>
<body>
<a href="index.html" id="back-btn">← Backroom 一覧</a>
<div id="loading-screen">
  <h2>🏚️ The Backrooms</h2>
  <div class="progress-wrap"><div class="progress-fill" id="pf"></div></div>
  <div class="pct" id="pct">0%</div>
  <div class="cdn-label" id="cdn-label">CDNに接続中...</div>
</div>
<div id="error-screen">
  <h2 style="color:#ef4444;font-size:20px;">⚠️ 読み込みに失敗しました</h2>
  <p style="color:#888;font-size:14px;">jsDelivr・GitHub Raw どちらも応答なし</p>
</div>
<div class="webgl-content">
  <div id="gameContainer"></div>
</div>
<script src="../config.js"></script>
<script>
(function() {
  var started = false;
  function showGame() {
    if (started) return;
    started = true;
    setTimeout(function() {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('gameContainer').style.display = 'block';
    }, 1000);
  }
  function showError() {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display = 'flex';
  }
  function ourProgress(instance, progress) {
    if (typeof progress === 'number') {
      var pct = Math.round(progress * 100);
      document.getElementById('pf').style.width = pct + '%';
      document.getElementById('pct').textContent = pct + '%';
      if (progress >= 1) showGame();
    } else if (progress === 'complete') {
      showGame();
    }
  }

  window.loadWithFallback('/the-backrooms/Build/UnityLoader.js',
    function(base) {
      document.getElementById('cdn-label').textContent =
        (base.includes('jsdelivr') ? 'jsDelivr' : 'GitHub Raw') + ' から読み込み中...';
      var B = base + '/the-backrooms/Build';
      var T = base + '/the-backrooms/TemplateData';

      var gameConfig = {
        companyName: "IEP",
        productName: "Backrooms",
        dataUrl: B + "/WebGL.data.unityweb",
        wasmCodeUrl: B + "/WebGL.wasm.code.unityweb",
        wasmFrameworkUrl: B + "/WebGL.wasm.framework.unityweb",
        TOTAL_MEMORY: 268435456,
        graphicsAPI: ["WebGL 2.0"],
        webglContextAttributes: { preserveDrawingBuffer: false },
        splashScreenStyle: "Dark",
        backgroundColor: "#0a0a00"
      };
      var blob = new Blob([JSON.stringify(gameConfig)], { type: 'application/json' });
      var configUrl = URL.createObjectURL(blob);

      UnityLoader.instantiate("gameContainer", configUrl, {
        onProgress: ourProgress,
        Module: {
          onRuntimeInitialized: function() { showGame(); }
        }
      });

      setTimeout(showGame, 60000);
    },
    showError
  );
})();
</script>
</body>
</html>
