<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snow Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030d1a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #0a1f3d, #0e2d55);
      border-bottom: 1px solid #7dd3fc22;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header .back {
      color: #7dd3fc;
      text-decoration: none;
      font-size: 13px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    header .back:hover { opacity: 1; }
    header h1 {
      font-size: 28px;
      background: linear-gradient(90deg, #7dd3fc, #bae6fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header .icon { font-size: 32px; }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .game-card {
      background: linear-gradient(135deg, #0a1e3a, #0d2a50);
      border: 1px solid #7dd3fc22;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .game-card:hover {
      transform: translateY(-4px);
      border-color: #7dd3fc;
      box-shadow: 0 8px 32px #7dd3fc33;
    }
    .game-card .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #071525;
      position: relative;
      overflow: hidden;
    }
    .game-card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }
    .game-card:hover .thumb img { transform: scale(1.05); }
    .game-card .thumb .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #0ea5e9;
      color: white;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .game-card .info { padding: 20px; }
    .game-card .info h2 {
      font-size: 18px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #7dd3fc, #bae6fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .game-card .info p {
      font-size: 13px;
      color: #5a8aaa;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .game-card .info .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: white;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .game-card:hover .play-btn { opacity: 0.9; }
  </style>
</head>
<body>

<header>
  <span class="icon">❄️</span>
  <h1>Snow Games</h1>
  <a class="back" href="../index.html" style="margin-left:auto">← ポータルトップ</a>
</header>

<div class="games-grid">

  <a class="game-card" href="snow-rider.html">
    <div class="thumb">
      <img src="https://g.geometrydash.app/snow-rider.webp" alt="Snow Rider" onerror="this.style.display='none'">
      <span class="badge">Sled Game</span>
    </div>
    <div class="info">
      <h2>Snow Rider</h2>
      <p>雪山の斜面をソリで疾走！障害物を避けながらプレゼントを集めてハイスコアを狙え。</p>
      <span class="play-btn">▶ プレイ</span>
    </div>
  </a>

  <a class="game-card" href="snow-rider-3d.html">
    <div class="thumb">
      <img src="https://freezenova.com/lessons/snowrider3d.webp" alt="Snow Rider 3D" onerror="this.style.display='none'">
      <span class="badge">3D Unity</span>
    </div>
    <div class="info">
      <h2>Snow Rider 3D</h2>
      <p>スリル満点の3Dそり滑りゲーム。雪山の急斜面を駆け抜け、贈り物を集めよう。Freezenova版。</p>
      <span class="play-btn">▶ プレイ</span>
    </div>
  </a>

</div>

</body>
</html>
